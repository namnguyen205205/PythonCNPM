{% extends "base.html" %}

{% block title %}
Đăng nhập
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-4">
                    Đăng nhập
                </h1>

                <form method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            value="{{ request.form.get('email', '') }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Mật khẩu
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                        >
                    </div>

                    <div class="form-check mb-3">
                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="remember"
                            name="remember"
                        >

                        <label
                            class="form-check-label"
                            for="remember"
                        >
                            Ghi nhớ đăng nhập
                        </label>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Đăng nhập
                    </button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Chưa có tài khoản?

                    <a href="{{ url_for('register') }}">
                        Đăng ký
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
