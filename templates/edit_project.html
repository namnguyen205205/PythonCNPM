{% extends "base.html" %}

{% block title %}
Sửa dự án
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">
                    Sửa thông tin dự án
                </h1>

                <form method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            Tên dự án
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            class="form-control"
                            value="{{ project.name }}"
                            maxlength="150"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">
                            Mô tả
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            class="form-control"
                            rows="4"
                        >{{ project.description or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="due_date" class="form-label">
                            Hạn dự kiến
                        </label>

                        <input
                            type="date"
                            id="due_date"
                            name="due_date"
                            class="form-control"
                            value="{% if project.due_date %}{{ project.due_date.isoformat() }}{% endif %}"
                        >
                    </div>

                    <div class="d-flex gap-2">
                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Lưu thay đổi
                        </button>

                        <a
                            href="{{ url_for(
                                'project_detail',
                                project_id=project.id
                            ) }}"
                            class="btn btn-outline-secondary"
                        >
                            Hủy
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
