{% extends "base.html" %}

{% block title %}
Đăng ký tài khoản
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-4">
                    Đăng ký tài khoản
                </h1>

                <form method="post">
                    <div class="mb-3">
                        <label for="full_name" class="form-label">
                            Họ và tên
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="full_name"
                            name="full_name"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Mật khẩu
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            minlength="6"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            for="confirm_password"
                            class="form-label"
                        >
                            Xác nhận mật khẩu
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            minlength="6"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Đăng ký
                    </button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Đã có tài khoản?

                    <a href="{{ url_for('login') }}">
                        Đăng nhập
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
